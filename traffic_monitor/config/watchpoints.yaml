# Watchpoints for Bužim → Waiblingen (return via Maljevac + Karawanken)
route:
  from: Bužim
  to: Waiblingen
  via: "Bužim → Maljevac → Zagreb → SI-A2 → A11 Karawanken → Villach → A10 Tauern → Salzburg → A8 → Waiblingen"
  approx_km: 960
  free_flow_hours: 11.5

# Keywords matched against ASFINAG / GPMaljevac / Promet texts
keywords:
  critical:
    - karawanken
    - karavanke
    - karavanken
    - tauern
    - katschberg
    - walserberg
    - villach
    - a10
    - a11
    - maljevac
    - izačić
    - izacic
    - velika kladuša
    - velika kladusa
    - bužim
    - buzim
  congestion:
    - stau
    - stockender verkehr
    - stockender
    - kolona
    - gužva
    - guzva
    - zastoj
    - congestion
    - queue
    - waiting
    - warteschlange
    - vollsperre
    - totalsperre
    - gesperrt
    - closed
    - zaprt
    - zatrpan

# German Autobahn.de roads on the corridor (approach to Waiblingen)
autobahn_roads:
  - A8
  - A99

# Bounding box roughly Salzburg → Stuttgart area (lat, lon)
autobahn_bbox:
  min_lat: 47.35
  max_lat: 49.0
  min_lon: 9.0
  max_lon: 13.1

# Delay seconds on Autobahn.de before alerting
autobahn_delay_threshold_sec: 600

# Optional border IDs for Nakordoni (BA=17 → HR=16, car=4) — return direction
nakordoni:
  origin: 17
  destination: 16
  crossing_type: 4
  # Alert if estimated wait minutes >= this
  wait_threshold_min: 45
  name_filters:
    - Maljevac
    - Velika Kladuša
    - Kladuša
    - Izačić
    - Izacic
    - Ličko Petrovo Selo
    - Licko Petrovo Selo
    - Litscho Petrowo Selo
    - Petrovo Selo

# HAK live border cameras. Still frames from desktop videowall (HD 1280×720);
# mobile page is linked for humans. AI queue analysis needs OPENAI_API_KEY.
hak_cameras:
  page: "https://m.hak.hr/kamera.asp?g=2&k=177"
  # HD JPEGs (www.hak.hr) — sharper than m.hak.hr/cam.asp (640×360).
  image_base: "https://www.hak.hr/info/kamere"
  # OpenAI vision model for queue counting. Override via OPENAI_VISION_MODEL env.
  # Vision JPEGs are cached ~20 min (see hak_cameras._CACHE_TTL_SEC).
  model: gpt-5.6-terra
  # Only alert from AI verdicts at/above this severity.
  analyze_min_severity: warning
  cams:
    # Return trip: your queue is BiH → HR (cam 429)
    - id: 429
      name: "Maljevac — Einreise BiH → HR"
      direction: "BiH->HR"
      relevant: true
      analyze: true
      role: "to_hr"
      count_hint: >
        Cam 429 / BiH→HR: nur Autos Richtung Betrachter (Markierung HR).
        Kolonne Richtung Kabinen (BiH) und Parkplaetze ignorieren. Oft 15–30 Autos.
    - id: 430
      name: "Maljevac — Ausreise HR → BiH"
      direction: "HR->BiH"
      relevant: true
      analyze: true
      role: "to_bih"
      count_hint: >
        Cam 430 / HR→BiH: nur die mittlere Kolonne zur blauen Kabinen-Ueberdachung.
        Gegenrichtung und Parkplatz rechts ignorieren. Oft 15–30 Autos.
    - id: 406
      name: "Velika Kladuša (BiH)"
      direction: "BiH"
      analyze: false
      relevant: false

# Facebook page «Granični prijelaz Maljevac» (same community as gpmaljevac.com).
# Direct post fetch needs FACEBOOK_PAGE_ACCESS_TOKEN secret; RSS covers portal posts always.
facebook_gpmaljevac:
  page_id: "100064800966799"
  page_url: "https://www.facebook.com/GPMaljevac"

poll_interval_sec: 300
cooldown_sec: 1800
