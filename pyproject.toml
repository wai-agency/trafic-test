[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stuttgart-buzim-traffic"
version = "1.0.0"
description = "Stau-Monitor Stuttgart → Bužim (Karawanken, Tauern, Grenze Maljevac)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
traffic-monitor = "traffic_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["traffic_monitor*"]

[tool.setuptools.package-data]
traffic_monitor = ["config/*.yaml"]
