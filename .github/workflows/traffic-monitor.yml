name: Traffic Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      min_severity:
        description: "Ab welcher Severity alerten"
        required: false
        default: warning
        type: choice
        options:
          - warning
          - critical
          - info
      force_notify:
        description: "Status-Ping nach Telegram schicken"
        required: false
        default: false
        type: boolean

concurrency:
  group: traffic-monitor
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Cache alert state
        uses: actions/cache@v4
        with:
          path: .traffic_alert_state.json
          key: traffic-alert-state-${{ github.run_id }}
          restore-keys: |
            traffic-alert-state-

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAKORDONI_API_KEY: ${{ secrets.NAKORDONI_API_KEY }}
          MIN_SEVERITY: ${{ github.event.inputs.min_severity || 'warning' }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN oder TELEGRAM_CHAT_ID fehlt."
            echo "Settings → Secrets and variables → Actions → New repository secret"
            echo "  TELEGRAM_BOT_TOKEN"
            echo "  TELEGRAM_CHAT_ID=5024687751"
            traffic-monitor check --min-severity "$MIN_SEVERITY" --console-only --state .traffic_alert_state.json
            exit 1
          fi

          traffic-monitor check --min-severity "$MIN_SEVERITY" --notify --state .traffic_alert_state.json

          if [ "$FORCE_NOTIFY" = "true" ]; then
            python - <<'PY'
          import os, httpx
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat = os.environ["TELEGRAM_CHAT_ID"]
          text = "✅ Reise Helper: Traffic Monitor Lauf OK"
          r = httpx.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat, "text": text},
              timeout=20,
          )
          r.raise_for_status()
          print("status ping sent")
          PY
          fi

      - name: Build mobile dashboard
        run: traffic-monitor dashboard --out site

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: buzimline-dashboard
          path: site
          retention-days: 7

  pages:
    needs: monitor
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Does not fail the whole workflow if Pages can't be enabled (private repos often need Pro or public).
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and build dashboard
        run: |
          pip install -e .
          traffic-monitor dashboard --out site

      - name: Setup Pages
        id: setup_pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.setup_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.setup_pages.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Pages hint
        if: steps.setup_pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages konnte nicht deployed werden."
          echo "Repo ist privat: entweder öffentlich machen ODER GitHub Pro,"
          echo "dann Settings → Pages → Source = GitHub Actions."
          echo "Dashboard-ZIP findest du im Job 'monitor' unter Artifacts."
