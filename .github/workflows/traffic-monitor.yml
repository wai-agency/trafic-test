name: Traffic Monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      min_severity:
        description: "Ab welcher Severity alerten"
        required: false
        default: warning
        type: choice
        options:
          - warning
          - critical
          - info
      force_notify:
        description: "Status-Ping nach Telegram schicken"
        required: false
        default: false
        type: boolean
      depart_advice:
        description: "Beste Abfahrt Waiblingen→Bužim berechnen + Telegram"
        required: false
        default: false
        type: boolean

concurrency:
  group: traffic-monitor
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Cache alert state
        uses: actions/cache@v4
        with:
          path: |
            .traffic_alert_state.json
            .camera_ai_cache.json
            site/perfect.json
          key: traffic-state-v4-${{ github.run_id }}
          restore-keys: |
            traffic-state-v4-
            traffic-state-v3-
            traffic-state-v2-
            traffic-alert-state-

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAKORDONI_API_KEY: ${{ secrets.NAKORDONI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_VISION_MODEL: ${{ secrets.OPENAI_VISION_MODEL }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          MIN_SEVERITY: ${{ github.event.inputs.min_severity || 'warning' }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN oder TELEGRAM_CHAT_ID fehlt in Secrets."
            echo "→ https://github.com/wai-agency/trafic-test/settings/secrets/actions"
            traffic-monitor check --min-severity "$MIN_SEVERITY" --console-only --state .traffic_alert_state.json
            exit 1
          fi

          traffic-monitor check --min-severity "$MIN_SEVERITY" --notify --state .traffic_alert_state.json

          if [ "${{ github.event.inputs.depart_advice }}" = "true" ] || [[ "${{ github.event.head_commit.message }}" == *"[depart]"* ]]; then
            traffic-monitor depart --notify
          fi

          mkdir -p site
          # Perfect-Optimizer: alle 30 Min (API: Google Directions × viele Slots).
          # Alerts/Kameras bleiben alle 15 Min. Push / [perfect] immer neu berechnen.
          MINUTE_UTC=$(date -u +%M)
          RUN_PERFECT=false
          if [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RUN_PERFECT=true
          elif [[ "$MINUTE_UTC" == "00" || "$MINUTE_UTC" == "30" ]]; then
            RUN_PERFECT=true
          fi
          if [[ "$RUN_PERFECT" == "true" ]]; then
            PERFECT_ARGS=(--out site/perfect.json)
            if [[ "${{ github.event.head_commit.message }}" == *"[perfect]"* ]]; then
              PERFECT_ARGS+=(--notify)
            fi
            traffic-monitor perfect "${PERFECT_ARGS[@]}" || echo "::warning::Perfect-Abfahrt konnte nicht berechnet werden"
          else
            echo "Perfect übersprungen (nächster Lauf :00/:30 UTC)"
            if [[ -f site/perfect.json ]]; then
              echo "Nutze gecachtes site/perfect.json"
            else
              echo "::warning::Kein gecachtes perfect.json — berechne jetzt einmalig"
              traffic-monitor perfect --out site/perfect.json || echo "::warning::Perfect-Abfahrt konnte nicht berechnet werden"
            fi
          fi

          if [ "$FORCE_NOTIFY" = "true" ]; then
            python - <<'PY'
          import os, httpx
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat = os.environ["TELEGRAM_CHAT_ID"]
          text = "✅ Reise Helper: Traffic Monitor Lauf OK\nDashboard: https://wai-agency.github.io/trafic-test/"
          r = httpx.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat, "text": text},
              timeout=20,
          )
          r.raise_for_status()
          print("status ping sent")
          PY
          fi

      - name: Build mobile dashboard
        env:
          NAKORDONI_API_KEY: ${{ secrets.NAKORDONI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_VISION_MODEL: ${{ secrets.OPENAI_VISION_MODEL }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: traffic-monitor dashboard --out site

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: buzimline-dashboard
          path: site
          retention-days: 7

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
